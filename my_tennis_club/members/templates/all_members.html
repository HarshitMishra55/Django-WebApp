<!DOCTYPE html>
<html>

<body>

  <h1>Members</h1>

  <table border="1">
    <tr>
      <th>Roll Number</th>
      <th>First Name</th>
      <th>Last Name</th>
      <th>Email</th>
    </tr>

    {% for x in mymembers %}
    <tr>
      <td>{{ x.universityrollnumber }}</td>
      <td>{{ x.firstname }}</td>
      <td>{{ x.lastname }}</td>
      <td>{{ x.email }}</td>
    </tr>
    {% empty %}
    <tr>
      <td colspan="4">No data found</td>
    </tr>
    {% endfor %}
  </table>
</body>
</html>
